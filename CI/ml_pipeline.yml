include:
    - CI/cmssw.yml
    - template: Code-Quality.gitlab-ci.yml

stages:
  - data
  - train
  - evaluate
  - hls4ml
  - synth
  - emulate
  - emulation-evaluate
  - profile
  - run_processes
  - run_TT_PU200
  - run_VBFHToBB_PU200
  - run_VBFHToCC_PU200
  - run_MinBias_PU200
  - run_QCD_Pt15To3000_PU200
  - emulation_regression
  - upload
  - test

variables:
    Name: new_samples_baseline_5param_extended_trk
    Inputs: baseline
    Model: baseline
    N_PARAMS: 5
    TRACK_ALGO: extended
    TRAIN: All200.root
    MINBIAS: MinBias_PU200.root
    BBBB: GluGluHHTo4B_PU200.root
    BBBB_EOS_DIR: /eos/cms/store/cmst3/group/l1tr/sewuchte/l1teg/fp_jettuples_240926_170X_v0.1_full/
    BBTT: GluGluHHTo2B2Tau_PU200.root
    BBTT_EOS_DIR: /eos/cms/store/cmst3/group/l1tr/sewuchte/l1teg/fp_jettuples_240926_170X_v0.1_full/
    VBFHTAUTAU: VBFHToTauTau_PU200.root
    NTUPLE_TREE: outnano/Jets
    SIGNAL: TT_PU200
    EOS_DATA_DIR: /eos/cms/store/cmst3/group/l1tr/sewuchte/l1teg/fp_jettuples_240926_170X_v0.1_full/
    EOS_STORAGE_DIR: /eos/project/c/cms-l1t-jet-tagger/www/${CI_PROJECT_NAME}
    EOS_STORAGE_SUBDIR: branches/${CI_COMMIT_REF_SLUG}/${Name}/pipeline${CI_PIPELINE_ID}
    EOS_STORAGE_DATADIR: branches/${CI_COMMIT_REF_SLUG}/${Name}/TrainingFiles
    EOS_STORAGE_PROCSDIR: branches/${CI_COMMIT_REF_SLUG}/${Name}/FPOutput
    CMSSW_VERSION: 'CMSSW_17_0_0_pre2'
    CMSSW_L1CT: 'CMS-L1T-Jet-Tagging:CMSSW_17_0_0_pre2_NGJet_plus_correlator'
    CMSSW_EMULATOR_WRAPPER: 'https://github.com/cms-hls4ml/L1TSC4NGJetModel.git'
    FASTPUPPI_VERSION: 'CMSSW_17_0_0_pre2_NGJet_plus_correlator'
    RERUN_ON_TAG: 'False'
    RUN_EMULATION: 'True'
    RUN_SYNTHESIS: 'True'
    TAG: 'v1.0.1'

.template:
  image: gitlab-registry.cern.ch/ml_l1/ops/docker-images/mamba_jettagger:latest
  before_script:
    - export PYTHONPATH=/builds/ml_l1/TrainTagger:$PYTHONPATH
    - echo "$AUTO_DEVOPS_CERNBOX_PASS" | kinit "$AUTO_DEVOPS_CERNBOX_USER@CERN.CH" > /dev/null
    - env
  script:
    - python $FOLDER/$SCRIPT $ARGS
  tags: [cern-nextgen-gpu]

data:
  extends:
    - .template
  stage: data
  tags: [cern-nextgen-gpu]
  rules:
   - changes:  # Include the job and set to when:manual if any of the follow paths match a modified file.
       - tagger/data/**
     when: manual
  script:
  - source activate tagger
  - mkdir data
  - cd data
  - export EOS_MGM_URL=root://eoscms.cern.ch
  - eos cp $EOS_DATA_DIR/${TRAIN} .
  - eos cp $EOS_DATA_DIR/${SIGNAL}.root .
  - cd ..
  - python tagger/data/make_data.py -i data/${TRAIN} --tree $NTUPLE_TREE -sig $SIGNAL
  - tar -cf training_data_$Inputs.tgz training_data
  - tar -cf signal_process_data.tgz signal_process_data
  - export EOS_MGM_URL=root://eosproject.cern.ch
  - eos mkdir -p ${EOS_STORAGE_DIR}/${EOS_STORAGE_DATADIR}
  - eos cp training_data_$Inputs.tgz ${EOS_STORAGE_DIR}/${EOS_STORAGE_DATADIR}
  - eos cp signal_process_data.tgz ${EOS_STORAGE_DIR}/${EOS_STORAGE_DATADIR}

train:
  extends:
    - .template
  stage: train
  tags: [cern-nextgen-gpu]
  needs:
    - job : data
      optional: true
  script:
  - eos cp ${EOS_STORAGE_DIR}/${EOS_STORAGE_DATADIR}/training_data_$Inputs.tgz .
  - tar -xf training_data_$Inputs.tgz
  - source activate tagger
  - ./CI/run_training.sh $RERUN_ON_TAG $RERUN_ON_OLDTRAINING
  artifacts:
    paths:
      - output
    exclude:
      - .npy
    expire_in: 7 days

evaluate:
  extends:
    - .template
  stage: evaluate
  tags: [cern-nextgen-gpu]
  script:
  - nproc
  - eos cp ${EOS_STORAGE_DIR}/${EOS_STORAGE_DATADIR}/training_data_$Inputs.tgz .
  - tar -xf training_data_$Inputs.tgz
  - source activate tagger
  - mkdir data
  - cd data
  - eos cp $EOS_DATA_DIR/$MINBIAS .
  - eos cp $BBBB_EOS_DIR/$BBBB .
  - eos cp $BBTT_EOS_DIR/$BBTT .
  - eos cp $EOS_DATA_DIR/$VBFHTAUTAU .
  - cd ..
  - echo "Trigger seed performance (bbtt, VBF tautau, topology tautau, bbbb, single tau)"
  # the samples copied above, as config keys (tagger/eval/config/defaults/inputs.yaml)
  - |
    cat > seed_inputs.yaml << EOF
    TREE: $NTUPLE_TREE
    MINBIAS_SAMPLE: data/$MINBIAS
    SIGNAL_SAMPLES:
      vbfHtautau: data/$VBFHTAUTAU
      hhbbtt: data/$BBTT
      hh4b: data/$BBBB
    EOF
  - python -m tagger.eval -m cmssw -c seeds --config seed_inputs.yaml
  - python -m tagger.eval -m output/$Model -c seeds --config seed_inputs.yaml
  - python -m tagger.plot -m output/$Model -c seeds
  artifacts:
    paths:
      - output
    when: always
    exclude:
      - .npy
    expire_in: 7 days

hls4ml:
  tags: [cern-nextgen-gpu]
  extends:
    - .template
  rules:
    - if: $RUN_SYNTHESIS == "True"
  stage: hls4ml
  needs:
    - job : train
      optional: true
  script:
  - pip uninstall hls4ml
  - git clone https://github.com/CMS-L1T-Jet-Tagging/hls4ml.git -b jet_tagger_hls4ml_update
  - cd hls4ml
  - pip install .
  - cd ..
  - eos cp ${EOS_STORAGE_DIR}/${EOS_STORAGE_DATADIR}/training_data_$Inputs.tgz .
  - tar -xf training_data_$Inputs.tgz
  - source activate tagger
  - python tagger/firmware/hls4ml_convert.py -m output/$Model -o output/$Model/firmware
  artifacts:
    paths:
      - output/$Model/firmware
    expire_in: 7 days

synth:
  tags:
    - fpga-large
  image: registry.cern.ch/ci4fpga/vivado:2023.2
  stage: synth
  needs : [hls4ml]
  rules:
    - if: $RUN_SYNTHESIS == "True"
  script:
    - cd output/$Model/firmware/L1TSC4NGJetModel
    - vitis_hls -f build_prj.tcl
    - vivado -mode batch -source vivado_synth.tcl
    - cd ../../../..
    - cp tagger/firmware/wrapper_generator.sh output/$Model/firmware/L1TSC4NGJetModel/firmware
    - cd output/$Model/firmware/L1TSC4NGJetModel/firmware
    - ./wrapper_generator.sh L1TSC4NGJetModel.h
    - cd ../../../../..
  artifacts:
    paths:
      - output/$Model/firmware/L1TSC4NGJetModel
    expire_in: 7 days

emulation-evaluate:
  extends:
    - .template
  stage: emulation-evaluate
  tags: [cern-nextgen-gpu]
  rules:
    - if: ($RUN_EMULATION == "True") && ($RUN_SYNTHESIS == "True")
  needs: [emulate,train,hls4ml]
  dependencies: [emulate,train,hls4ml]
  script:
  - pip uninstall hls4ml
  - git clone https://github.com/CMS-L1T-Jet-Tagging/hls4ml.git -b jet_tagger_hls4ml_update
  - cd hls4ml
  - pip install .
  - cd ..
  - mkdir data
  - cd data
  - cp ../${CMSSW_VERSION}/src/FastPUPPI/NtupleProducer/python/jetTuple_${TRACK_ALGO}_${N_PARAMS}.root .
  - cd ..
  - source activate tagger
  # the network, its hls4ml build and its CMSSW emulator on the same jets
  - python -m tagger.eval -m output/$Model -m hls4ml:output/$Model -m emulator:output/$Model -c emulation
    --set "EMULATION_SAMPLE=data/jetTuple_${TRACK_ALGO}_${N_PARAMS}.root"
  - python -m tagger.plot -m output/$Model -c emulation
  artifacts:
    paths:
      - output/$Model
    expire_in: 7 days

profile:
  extends:
    - .template
  stage: profile
  tags: [cern-nextgen-gpu]
  needs: [emulate,train,hls4ml,synth]
  dependencies: [emulate,train,hls4ml,synth]
  rules:
    - if: ($RUN_EMULATION == "True") &&  ($RUN_SYNTHESIS == "True")
  script:
  - pip uninstall hls4ml
  - git clone https://github.com/CMS-L1T-Jet-Tagging/hls4ml.git -b jet_tagger_hls4ml_update
  - cd hls4ml
  - pip install .
  - cd ..
  - source activate tagger
  - pip install hls4ml[profiling]
  - mkdir data
  - cd data
  - cp ../${CMSSW_VERSION}/src/FastPUPPI/NtupleProducer/python/jetTuple_${TRACK_ALGO}_${N_PARAMS}.root .
  - cd ..
  - python tagger/firmware/hls4ml_profile.py -r True -i data/jetTuple_${TRACK_ALGO}_${N_PARAMS}.root -m output/$Model -of output/$Model/firmware -o output/$Model/plots/profile
  artifacts:
    expire_in: 7 days

run_processes:
  image: gitlab-registry.cern.ch/cms-cloud/cmssw-docker/al8-cms:latest
  stage: run_processes
  tags: [cern-nextgen-gpu]
  needs:
    - job : hls4ml
      optional: true
  rules:
    - if: ($RUN_EMULATION == "True") && ($RUN_SYNTHESIS == "True")
  before_script:
    - source /cvmfs/grid.cern.ch/etc/profile.d/setup-cvmfs-ui.sh
    - source /cvmfs/cms.cern.ch/cmsset_default.sh
    - echo "$AUTO_DEVOPS_CERNBOX_PASS" | kinit "$AUTO_DEVOPS_CERNBOX_USER@CERN.CH" > /dev/null
  script:
  - ./CI/build_cmssw.sh -run ${CMSSW_VERSION} ${CMSSW_L1CT} ${FASTPUPPI_VERSION} ${PROCESS} ${EOS_STORAGE_DIR}/${EOS_STORAGE_PROCSDIR}
  parallel:
    matrix:
      - PROCESS: [TT_PU200,VBFHToBB_PU200,VBFHToCC_PU200,MinBias_PU200,QCD_Pt15To3000_PU200]
  artifacts:
    paths:
      - ${CMSSW_VERSION}/src/FastPUPPI/NtupleProducer/python/*.log
    expire_in: 7 days

emulation_regression:
  extends:
    - .template
  stage: emulation_regression
  tags: [cern-nextgen-gpu]
  needs:
    - job : run_processes
      optional: true
  rules:
    - if: ($RUN_EMULATION == "True") && ($RUN_SYNTHESIS == "True")
  script:
  - source activate tagger
  - export KRB5CCNAME=$(klist -e  | egrep -o 'FILE:.*')
  # FastPUPPI ntuples of run_processes
  - python -m tagger.eval -m output/$Model -c emulationRegression
    --set "FASTPUPPI_DIR=${EOS_STORAGE_DIR}/${EOS_STORAGE_PROCSDIR}"
  - python -m tagger.plot -m output/$Model -c emulationRegression
  artifacts:
    paths:
      - output/$Model
    expire_in: 7 days

upload_new_model:
  image: gitlab-registry.cern.ch/ml_l1/ops/docker-images/mamba_jettagger:latest
  stage: upload
  tags: [k8s-default]
  rules:
    - if: $RERUN_ON_TAG == "False"
  needs:
    - job: train
      optional: false
    - job: evaluate
      optional: false
    - job: emulation-evaluate
      optional: true
    - job: emulate
      optional: true
    - job: hls4ml
      optional: true
    - job: profile
      optional: true
    - job: emulation_regression
      optional: false
  before_script:
    - export PYTHONPATH=/builds/ml_l1/TrainTagger:$PYTHONPATH
    - echo "$AUTO_DEVOPS_CERNBOX_PASS" | kinit "$AUTO_DEVOPS_CERNBOX_USER@CERN.CH" > /dev/null
  script:
    - ./CI/upload_new_model.sh
  artifacts:
    paths:
      - $Name
    expire_in: 7 days

upload_tagged_model:
  image: gitlab-registry.cern.ch/ml_l1/ops/docker-images/mamba_jettagger:latest
  stage: upload
  tags: [k8s-gpu]
  # needs also downloads the artefacts of these jobs
  needs:
    - emulation-evaluate
    - hls4ml
    - train
    - evaluate
    - profile
    - synth
    - job: emulation_regression
      optional: true
  rules:
    - if: $RERUN_ON_TAG == "True"
  before_script:
    - export EOS_MGM_URL=root://eosproject.cern.ch
    - export PYTHONPATH=/builds/ml_l1/TrainTagger:$PYTHONPATH
    - echo "$AUTO_DEVOPS_CERNBOX_PASS" | kinit "$AUTO_DEVOPS_CERNBOX_USER@CERN.CH" > /dev/null
  script:
    - source activate tagger
    - echo ${EOS_STORAGE_DIR}/tags/${TAG}
    - eos ls ${EOS_STORAGE_DIR}/tags/${TAG}
    - ls ${EOS_STORAGE_DIR}/tags/${TAG}
    - mkdir -p ${EOS_STORAGE_DIR}/tags/${TAG}/test/firmware
    - mkdir -p ${EOS_STORAGE_DIR}/tags/${TAG}/test/plots
    - mkdir $Name
    - cd output/$Model/firmware
    - tar -cvf L1TSC4NGJetModel.tgz L1TSC4NGJetModel
    - cp -r L1TSC4NGJetModel.tgz ${EOS_STORAGE_DIR}/tags/${TAG}/test/firmware/
    - cd ../../..
    - mkdir $Name/plots
    - mv output/$Model/plots/emulation $Name/plots
    - mv output/$Model/plots/profile $Name/plots
    - mv output/$Model/plots/training/ $Name/plots
    - mv output/$Model/plots/physics/ $Name/plots
    - if [ -d output/$Model/plots/emulation_regression ]; then mv output/$Model/plots/emulation_regression $Name/plots; fi
    # eval results (tagger.eval), in the layout of a model folder as in upload_new_model.sh
    - |
      mkdir -p ${EOS_STORAGE_DIR}/tags/${TAG}/test/eval
      cp -r output/$Model/eval/* ${EOS_STORAGE_DIR}/tags/${TAG}/test/eval/
      for results in output/$Model/hls4ml output/$Model/emulator output/cmssw; do
          if [ -d $results/eval ]; then
              mkdir -p ${EOS_STORAGE_DIR}/tags/${TAG}/test/$(basename $results)/eval
              cp -r $results/eval/* ${EOS_STORAGE_DIR}/tags/${TAG}/test/$(basename $results)/eval/
          fi
      done
    - cd ..
    - rm -rf php-plots
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.cern.ch/cebrown/php-plots -b feature/update_extension_grouping
    - export PATH="${PATH}:/builds/ml_l1/php-plots/bin"
    - pb_copy_index.py TrainTagger/${Name} --recursive
    # - pb_copy_index.py ${EOS_STORAGE_DIR}/tags/${TAG}/test --recursive
    - cd TrainTagger/${Name}
    - pb_deploy_plots.py plots ${EOS_STORAGE_DIR}/tags/${TAG}/test/plots --recursive --extensions png,pdf
  artifacts:
    paths:
      - $Name
    expire_in: 7 days

code_quality:
   tags:
    - docker-privileged-xl
   artifacts:
    reports:
      codequality: gl-code-quality-report.json

unit_tests:
  stage: test
  image: gitlab-registry.cern.ch/ml_l1/ops/docker-images/mamba_jettagger:latest
  needs: []  # toy inputs only: runs at the start of the pipeline, without the training
  script:
    - source activate tagger
    - pip install pytest  # in case the CI image lacks it
    - python -m pytest

pylint:
  stage: test
  image: python:3.7-slim
  before_script:
    - mkdir -p public/badges public/lint
    - echo undefined > public/badges/$CI_JOB_NAME.score
    - pip install pylint-gitlab
  script:
    - pylint --exit-zero --output-format=text $(find -type f -name "*.py" ! -path "**/.venv/**") | tee /tmp/pylint.txt
    - sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' /tmp/pylint.txt > public/badges/$CI_JOB_NAME.score
    - pylint --exit-zero --output-format=pylint_gitlab.GitlabCodeClimateReporter $(find -type f -name "*.py" ! -path "**/.venv/**") > codeclimate.json
    - pylint --exit-zero --output-format=pylint_gitlab.GitlabPagesHtmlReporter $(find -type f -name "*.py" ! -path "**/.venv/**") > public/lint/index.html
  after_script:
    - anybadge --overwrite --label $CI_JOB_NAME --value=$(cat public/badges/$CI_JOB_NAME.score) --file=public/badges/$CI_JOB_NAME.svg 4=red 6=orange 8=yellow 10=green
    - |
      echo "Your score is: $(cat public/badges/$CI_JOB_NAME.score)"
  artifacts:
    paths:
      - public
    reports:
      codequality: codeclimate.json
    when: always
