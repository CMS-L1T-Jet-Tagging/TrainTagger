name: tagger
channels:
  - conda-forge
dependencies:
  - python=3.13.*
  - pip
  - numpy
  - pandas
  - pip:
    - matplotlib
    - mplhep
    - scikit-learn
    - uproot
    - xxhash
    - pyarrow
    - hist
    - shap
    - awkward-pandas
    - mlflow
    - histbook
    - notebook
    - schema
    - tqdm
    - da4ml>=0.6.0
    - pquant-ml
    - hgq2>=0.2.0
    - alkaid>=0.8.1
    - jax
    - hls4ml[profiling]
    - coffea
    - triggerflow

    # For hardware synthesis
    - tensorflow[and-cuda]
    - pyparsing
