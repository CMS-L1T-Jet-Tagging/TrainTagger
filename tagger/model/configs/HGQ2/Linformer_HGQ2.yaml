model: LinformerHGQ2
run_config :
  verbose : 2
  debug : True
  num_threads : 24

model_config :
  name : Linformer_HGQ2
  feedforward_dim : 16
  projection_k : 2
  num_heads : 1
  classification_layers : [32,16]
  classification_parallelisation_factor : [32,16]
  regression_layers : [32,16]
  regression_parallelisation_factor : [32,16]
  beta: 1.1e-8

quantization_config:

input_config:
  # Specify inputs for the model here, order is defined in data/puppicand.yaml. New inputs should always
  # be added here and in puppicands yaml
  basic_input_config: ["pt", "pt_rel", "pt_log", "deta", "dphi", "mass", "isPhoton", "isElectronPlus",
    "isElectronMinus", "isMuonPlus", "isMuonMinus", "isNeutralHadron", "isChargedHadronPlus",
    "isChargedHadronMinus", "z0", "dxy", "isfilled", "puppiweight", "emid", "quality"] # features to use in the basic_input
  basic_features: ['basic_input']
  jet_features: [] # will later be concatenated into one jet features input


training_config :
  weight_method: ["onlyclass", "onlyclass"]
  epochs : 200
  batch_size : 1024
  learning_rate : 0.003
  validation_split : 0.1

  loss_weights : [1,1]

  target_ebops : 300000

  pileup: False


firmware_config:
  input_precision: {'basic_input': 'ap_fixed<24,12,AP_RND,AP_SAT>'}
  class_precision: 'ap_ufixed<24,12,AP_RND,AP_SAT>'
  reg_precision: 'ap_fixed<16,6,AP_RND,AP_SAT>'

  clock_period : 2.5
  fpga_part : 'xcvu13p-flga2577-2-e'

  project_name: 'L1TSC4NGJetModel_Linf_HGQ'