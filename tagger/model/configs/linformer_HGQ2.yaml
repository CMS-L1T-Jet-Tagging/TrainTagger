model: LinformerHGQ2
run_config :
  verbose : 2
  debug : True
  num_threads : 24

model_config :
  name : linformer_HGQ2
  feedforward_dim : 16
  projection_k : 2
  num_heads : 1
  classification_layers : [16,8]
  classification_parallelisation_factor : [16,8]
  regression_layers : [8]
  regression_parallelisation_factor : [8]
  beta: 1.1e-8

quantization_config:
  pt_output_quantization : [16,6]

training_config :
  weight_method: "onlyclass"
  epochs : 300
  batch_size : 2048
  learning_rate : 0.003
  validation_split : 0.1

  loss_weights : [1,1]

  target_ebops : 300000


firmware_config:
  input_precision: 'ap_fixed<24,12,AP_RND,AP_SAT>'
  class_precision: 'ap_ufixed<24,12,AP_RND,AP_SAT>'
  reg_precision: 'ap_fixed<16,6,AP_RND,AP_SAT>'

  clock_period : 2.5
  fpga_part : 'xcvu13p-flga2577-2-e'

  project_name: 'L1TSC4NGJetModel'


