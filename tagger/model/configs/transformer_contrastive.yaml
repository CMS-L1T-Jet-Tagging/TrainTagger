model: TransformerEmbeddingModel
run_config :
  verbose : 2
  debug : True
  num_threads : 24

model_config :
  name : transformer
  emb_layers : [8,8]
  transformer_layers : [[2,4,2,8],[2,4,2,8]] #num_heads, mha_hidden_dim, num_dense_layers, dim_dense_layers
  classification_layers : [32,16]
  regression_layers : [10]
  projection_dims : 8
  kernel_initializer : 'lecun_uniform'
  projection_blocks : 5

quantization_config:

training_config :
  weight_method: "onlyclass"
  embedding_epochs : 40
  finetuning_epochs : 200
  batch_size : 1024
  learning_rate : 0.011585881732365359
  embedding_lr : 0.02224002777017712
  masking_probability : 0.19352447006728993
  loss_temperature :  0.4911345114327149

  validation_split : 0.1
  loss_weights : [1,4]
  EarlyStopping_patience : 20
  ReduceLROnPlateau_factor : 0.5
  ReduceLROnPlateau_patience : 10
  ReduceLROnPlateau_min_lr : 0.00001

firmware_config:

