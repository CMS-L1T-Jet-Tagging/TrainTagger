model: WeightedAverageSimpleModel
run_config :
  verbose : 2
  debug : True
  num_threads : 64

model_config :
  name : weightedAverageSimple
  conv1d_layers : [10,10]
  classification_layers : [32,16]
  regression_layers : [16]
  kernel_initializer : 'lecun_uniform'
  aggregator : 'mean'

quantization_config:
  quantizer_bits : 9
  quantizer_bits_int : 2
  quantizer_alpha_val : 1.0
  pt_output_quantization : [16,2]

inputs:
  basic_input_config: ['eta'] # features to add to the basic input
  basic_features: ['basic_input', 'constituent_fraction', 'pt_mask']
  custom_features: ['jet_pt_log', 'jet_eta'] # will later be concatenated into one jet features input

training_config :
  weight_method: ["onlyclass", "ptref"]
  epochs : 3
  batch_size : 1024
  learning_rate : 0.001
  validation_split : 0.1

  loss_weights : [1,65] # class, regression
  huber_weights : [2, 3] # pu, alpha

  initial_sparsity : 0.0
  final_sparsity : 0.1

  EarlyStopping_patience : 10

  ReduceLROnPlateau_factor : 0.5
  ReduceLROnPlateau_patience : 5
  ReduceLROnPlateau_min_lr : 0.00001

  pileup: True

firmware_config:
  input_precision: {'basic_input': 'ap_fixed<32,16,AP_RND,AP_SAT>',
                    'constituent_fraction': 'ap_ufixed<17,1,AP_RND,AP_SAT>',
                    'jet_features': 'ap_fixed<32,16,AP_RND,AP_SAT>',
                    'pt_mask': 'ap_uint<1>'}
  class_precision: 'ap_ufixed<24,12,AP_RND,AP_SAT>'
  reg_precision: 'ap_ufixed<16,2,AP_RND,AP_SAT>'

  clock_period : 2.5
  fpga_part : 'xcvu13p-flga2577-2-e'

  project_name: 'L1TSC4NGJetModel'
